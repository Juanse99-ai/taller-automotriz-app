<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Taller Automotriz</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .button { background: #007bff; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Prueba del Sistema Taller Automotriz</h1>
    
    <div class="test">
        <h3>✅ Archivos CSS:</h3>
        <div id="css-status">Verificando...</div>
    </div>
    
    <div class="test">
        <h3>✅ Archivos JavaScript:</h3>
        <div id="js-status">Verificando...</div>
    </div>
    
    <div class="test">
        <h3>✅ LocalStorage:</h3>
        <div id="storage-status">Verificando...</div>
    </div>
    
    <a href="index.html" class="button">🚀 Ir a la Aplicación Principal</a>
    
    <script>
        // Verificar CSS
        const cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = './assets/css/styles.css';
        cssLink.onload = () => {
            document.getElementById('css-status').innerHTML = '✅ CSS cargado correctamente';
            document.getElementById('css-status').className = 'success';
        };
        cssLink.onerror = () => {
            document.getElementById('css-status').innerHTML = '❌ Error al cargar CSS';
            document.getElementById('css-status').className = 'error';
        };
        document.head.appendChild(cssLink);
        
        // Verificar JavaScript
        const jsScript = document.createElement('script');
        jsScript.src = './assets/js/app.js';
        jsScript.onload = () => {
            document.getElementById('js-status').innerHTML = '✅ JavaScript cargado correctamente';
            document.getElementById('js-status').className = 'success';
        };
        jsScript.onerror = () => {
            document.getElementById('js-status').innerHTML = '❌ Error al cargar JavaScript';
            document.getElementById('js-status').className = 'error';
        };
        document.body.appendChild(jsScript);
        
        // Verificar LocalStorage
        try {
            localStorage.setItem('test', 'ok');
            localStorage.removeItem('test');
            document.getElementById('storage-status').innerHTML = '✅ LocalStorage disponible';
            document.getElementById('storage-status').className = 'success';
        } catch (e) {
            document.getElementById('storage-status').innerHTML = '❌ LocalStorage no disponible';
            document.getElementById('storage-status').className = 'error';
        }
    </script>
</body>
</html>
