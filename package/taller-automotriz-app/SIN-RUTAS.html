<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Automotriz - Test Sin Rutas</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { 
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 { 
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input { 
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
        }
        .button { 
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .status { 
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .links { 
            margin-top: 20px;
            text-align: center;
        }
        .links a { 
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏭 Test Sin Rutas</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Sin archivos externos</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Usuario:</label>
                <input type="text" id="username" value="admin">
            </div>
            
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" id="password" value="admin">
            </div>
            
            <button type="submit" class="button">Iniciar Sesión</button>
        </form>
        
        <div id="status" class="status" style="display: none;"></div>
        
        <div class="links">
            <a href="ONLY-HTML.html">Solo HTML</a>
            <a href="EMERGENCIA.html">Emergencia</a>
        </div>
    </div>

    <script>
        const users = {
            'admin': { password: 'admin', role: 'admin', name: 'Administrador' }
        };
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showStatus('Complete todos los campos', 'error');
                return;
            }
            
            if (users[username] && users[username].password === password) {
                const user = users[username];
                showStatus(`Bienvenido ${user.name}`, 'success');
            } else {
                showStatus('Credenciales incorrectas', 'error');
            }
        });
        
        console.log('✅ Test sin rutas cargado');
    </script>
</body>
</html>
