<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Taller MultiAS</title>

    <!-- PWA: instalable en el inicio del teléfono, pantalla completa -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1b35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MultiAS" />
  </head>
  <body>
    <div id="root"></div>
    <!-- El frescor y el offline ahora los maneja el service worker (public/sw.js):
         navegacion = NetworkFirst (siempre lo mas nuevo con red), assets con hash
         = CacheFirst. Se registra desde src/main.jsx solo en produccion. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
