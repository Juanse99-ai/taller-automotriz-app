<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Taller MultiAS</title>

    <!-- PWA: instalable en el inicio del teléfono, pantalla completa -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1b35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MultiAS" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Auto-cleanup: desregistra cualquier Service Worker viejo y limpia caches
      // (resuelve casos donde Safari/Chrome sirven JS cacheado tras un deploy)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()))
      }
      if ('caches' in window) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)))
      }
    </script>
    <script>
      // Auto-actualización: si el servidor ya tiene un bundle más nuevo que el
      // cargado, recarga UNA vez. Así, tras un deploy, no te quedas viendo la
      // versión cacheada (Safari/pestaña fija). En dev no hace nada.
      (function () {
        function loadedBundle() {
          var s = document.querySelector('script[type="module"][src*="/assets/index-"]');
          return s ? s.getAttribute('src') : null;
        }
        async function check() {
          try {
            var res = await fetch('/?_=' + Date.now(), { cache: 'no-store' });
            var html = await res.text();
            var m = html.match(/\/assets\/index-[A-Za-z0-9_-]+\.js/);
            var latest = m ? m[0] : null;
            var cur = loadedBundle();
            if (latest && cur && cur.indexOf(latest) === -1) {
              if (!sessionStorage.getItem('__reloadedForUpdate')) {
                sessionStorage.setItem('__reloadedForUpdate', '1');
                location.reload();
              }
            } else if (latest && cur) {
              sessionStorage.removeItem('__reloadedForUpdate');
            }
          } catch (e) {}
        }
        window.addEventListener('load', check);
        window.addEventListener('focus', check);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
