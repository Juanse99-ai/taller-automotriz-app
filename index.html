<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="64x64" href="/logo.png?v=3" />
    <link rel="apple-touch-icon" href="/logo.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App MultiAS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Auto-cleanup: desregistra cualquier Service Worker viejo y limpia caches
      // (resuelve casos donde Safari/Chrome sirven JS cacheado tras un deploy)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()))
      }
      if ('caches' in window) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)))
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
