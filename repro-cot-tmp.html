<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>repro cot</title>
<link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-sans/latin-400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-sans/latin-500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-sans/latin-600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-sans/latin-700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-mono/latin-400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-mono/latin-500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-mono/latin-600.css">
<link rel="stylesheet" href="/src/index.css">
</head>
<body>
<div class="app"><div class="main"><div class="content">
  <div class="card">
    <div class="card__h"><h3>Cotizaciones</h3><span class="count">3</span></div>
    <div class="card__b card__b--flush">
      <table class="tbl tbl-cards tbl-cards--cot">
        <thead><tr>
          <th>Ref.</th><th>Cliente</th><th>Placa</th><th>Vehículo</th><th>Estado</th>
          <th class="c-right">Total</th><th>Fecha</th><th></th><th></th>
        </tr></thead>
        <tbody>
          <tr class="cot-row" id="row-largo">
            <td class="c-mono td-ref" data-label="Ref.">0002</td>
            <td class="c-name">MULTISERVICIOS AMC SAS DE COLOMBIA</td>
            <td class="c-mono td-placa" style="font-weight:700" data-label="Placa">WGT456</td>
            <td class="c-muted td-veh" data-label="Vehículo">Chevrolet Captiva Sport 2014</td>
            <td class="td-estado" data-label="Estado"><span class="badge badge-warning">pendiente</span></td>
            <td class="c-right c-mono td-total" data-label="Total">$12.345.678</td>
            <td class="c-muted td-fecha" data-label="Fecha">17 de jul de 2026
              <div class="cot-espera">hace 12 días</div></td>
            <td class="td-actions"><div class="actions-cell">
              <button class="btn btn-outline btn-sm">Revisar</button>
              <button class="icon-btn" aria-label="Más acciones"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
            </div></td>
            <td class="td-chevron" aria-hidden="true">›</td>
          </tr>
          <tr class="cot-row" id="row-corto">
            <td class="c-mono td-ref" data-label="Ref.">0003</td>
            <td class="c-name">Juan Pérez</td>
            <td class="c-mono td-placa" style="font-weight:700" data-label="Placa">ABC12D</td>
            <td class="c-muted td-veh" data-label="Vehículo">Mazda 3 2019</td>
            <td class="td-estado" data-label="Estado"><span class="badge badge-success">aprobada</span></td>
            <td class="c-right c-mono td-total" data-label="Total">$450.000</td>
            <td class="c-muted td-fecha" data-label="Fecha">2 de ago de 2026</td>
            <td class="td-actions"><div class="actions-cell">
              <button class="btn btn-primary btn-sm">Crear trabajo</button>
              <button class="icon-btn" aria-label="Más acciones"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
            </div></td>
            <td class="td-chevron" aria-hidden="true">›</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div></div></div>
</body></html>
